<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>BibleSearch</title>
  <style>
    html, body { display:block !important; visibility:visible !important; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      color: #333;
      background: #f5f5f5;
      margin: 0;
      padding: 12px;
    }

    h2 { font-size: 11px; text-transform: uppercase; color: #888; margin: 16px 0 6px; letter-spacing: 0.5px; }

    label { display: block; font-size: 12px; margin-bottom: 3px; color: #555; }

    select, button {
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      box-sizing: border-box;
      margin-bottom: 8px;
    }

    button {
      background: #4a90d9;
      color: #fff;
      border-color: #3a80c9;
      cursor: pointer;
    }

    .row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .row input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
    .row span { font-size: 13px; font-weight: bold; }

    .hint { font-size: 11px; color: #888; margin-bottom: 12px; }
    .saved { font-size: 11px; color: #4caf50; }

    .examples { font-size: 12px; line-height: 1.8; background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px 10px; }
    .examples code { background: #e8f0fe; color: #1a73e8; padding: 1px 4px; border-radius: 3px; font-family: monospace; }
  </style>
</head>
<body>

<script>
(function () {
  function forceVisible() {
    [document.documentElement, document.body].forEach(function (el) {
      if (!el) return;
      el.removeAttribute('hidden');
      el.style.setProperty('display',     'block',   'important');
      el.style.setProperty('visibility',  'visible', 'important');
      el.style.setProperty('opacity',     '1',       'important');
    });
  }
  forceVisible();
  // MutationObserver: reagiert auf jede Style/Attribut-Änderung
  new MutationObserver(forceVisible).observe(document.documentElement, {
    attributes: true, subtree: true, childList: false
  });
  // Interval als letzter Ausweg – gewinnt gegen verzögerte plugins.js-Callbacks
  setInterval(forceVisible, 80);
  document.addEventListener('DOMContentLoaded', forceVisible);
  window.addEventListener('load', forceVisible);
}());
</script>

<div style="font-weight:bold;font-size:15px;color:#1a73e8;margin-bottom:2px;">BibelSuche</div>
<div style="font-size:11px;color:#999;margin-bottom:14px;">@Referenz tippen → Tab → Vers einfügen</div>

<div class="row">
  <input type="checkbox" id="enabled">
  <span>Inline-Einfügung aktiv</span>
</div>
<div class="hint" id="toggleSub">Deaktiviert</div>

<h2>Bibelübersetzung</h2>
<select id="trl">
  <option value="delut">Luther 1912 (Deutsch)</option>
  <option value="elb1905">Elberfelder 1905 (Deutsch)</option>
  <option value="kjv">King James Version (Englisch)</option>
  <option value="web">World English Bible (Englisch)</option>
</select>

<h2>Versformat</h2>
<select id="linebreaks">
  <option value="prose">Fließtext</option>
  <option value="lines">Jeder Vers eigene Zeile</option>
</select>

<h2>Ausgabe</h2>
<select id="fmt">
  <option value="with_ref">Text + Bibelstelle</option>
  <option value="text_only">Nur Text</option>
  <option value="with_source">Text + Stelle + Übersetzung</option>
</select>

<button id="saveBtn">Speichern</button>
<div class="saved" id="savedMsg"></div>

<h2>Beispiele</h2>
<div class="examples">
  <code>@Joh3:16</code> Einzelner Vers<br>
  <code>@1Mo1:1-3</code> Versbereich<br>
  <code>@Ps23</code> Ganzes Kapitel<br>
  <code>@Mt5:3-12</code> Seligpreisungen
</div>

<script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"
        onerror="console.warn('plugins.js CDN nicht erreichbar')"></script>

<script src="scripts/code.js"></script>

<script>
(function () {
  var enabledEl = document.getElementById('enabled');
  var toggleSub = document.getElementById('toggleSub');
  var trlEl     = document.getElementById('trl');
  var lbEl      = document.getElementById('linebreaks');
  var fmtEl     = document.getElementById('fmt');
  var saveBtn   = document.getElementById('saveBtn');
  var savedMsg  = document.getElementById('savedMsg');

  var on = localStorage.getItem('bs_enabled') === '1';
  enabledEl.checked = on;
  toggleSub.textContent = on ? 'Aktiviert' : 'Deaktiviert';

  trlEl.value = localStorage.getItem('bs_translation') || 'delut';
  lbEl.value  = localStorage.getItem('bs_linebreaks')  || 'prose';
  fmtEl.value = localStorage.getItem('bs_format')      || 'with_ref';

  enabledEl.addEventListener('change', function () {
    localStorage.setItem('bs_enabled', this.checked ? '1' : '0');
    toggleSub.textContent = this.checked ? 'Aktiviert' : 'Deaktiviert';
  });

  saveBtn.addEventListener('click', function () {
    localStorage.setItem('bs_translation', trlEl.value);
    localStorage.setItem('bs_linebreaks',  lbEl.value);
    localStorage.setItem('bs_format',      fmtEl.value);
    savedMsg.textContent = '✓ Gespeichert';
    setTimeout(function () { savedMsg.textContent = ''; }, 2000);
  });
}());
</script>

</body>
</html>
