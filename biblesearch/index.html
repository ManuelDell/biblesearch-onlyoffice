<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>BibleSearch</title>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
  <link rel="stylesheet" href="styles/plugin.css">
</head>
<body>
<div class="wrap">

  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="6" fill="#1a73e8"/>
      <rect x="7" y="6" width="14" height="17" rx="1.5" fill="white" fill-opacity="0.2"/>
      <rect x="8" y="7" width="12" height="15" rx="1" fill="white"/>
      <rect x="10" y="11" width="8" height="1.2" rx="0.6" fill="#1a73e8"/>
      <rect x="10" y="13.5" width="8" height="1.2" rx="0.6" fill="#1a73e8"/>
      <rect x="10" y="16" width="5" height="1.2" rx="0.6" fill="#1a73e8"/>
      <rect x="13" y="8.5" width="2" height="4" rx="0.5" fill="#1a73e8" fill-opacity="0.5"/>
    </svg>
    <div>
      <h1>BibleSearch</h1>
      <p>Bibelverse per @Referenz einfügen</p>
    </div>
  </div>

  <div class="section">
    <h2>Verwendung</h2>
    <ul class="examples">
      <li><code>@Joh3:16</code>    <span>Einzelner Vers</span></li>
      <li><code>@1Mo1:1-3</code>   <span>Versbereich</span></li>
      <li><code>@Ps23:1</code>     <span>Psalm</span></li>
      <li><code>@Offb22:20</code>  <span>Letztes Buch</span></li>
      <li><code>@Mt5:3-12</code>   <span>Seligpreisungen</span></li>
    </ul>
  </div>

  <div class="section">
    <h2>Einstellungen</h2>

    <label for="trl">Bibelübersetzung</label>
    <select id="trl">
      <option value="delut">Luther 1912 (Deutsch)</option>
      <option value="elb1905">Elberfelder 1905 (Deutsch)</option>
      <option value="kjv">King James Version (Englisch)</option>
      <option value="web">World English Bible (Englisch)</option>
    </select>

    <label for="fmt">Ausgabeformat</label>
    <select id="fmt">
      <option value="with_ref">Verstext + Bibelstelle</option>
      <option value="text_only">Nur Verstext</option>
      <option value="with_source">Verstext + Stelle + Übersetzung</option>
    </select>

    <button class="save" id="saveBtn">Speichern</button>
    <p class="saved" id="savedMsg"></p>
  </div>

</div>

<script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
<script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
<script src="scripts/code.js"></script>
<script>
  // Einstellungen laden und speichern (läuft im selben iframe wie code.js)
  (function () {
    var trlEl  = document.getElementById('trl');
    var fmtEl  = document.getElementById('fmt');
    var btn    = document.getElementById('saveBtn');
    var msg    = document.getElementById('savedMsg');

    // Gespeicherte Werte laden
    trlEl.value = localStorage.getItem('bs_translation') || 'delut';
    fmtEl.value = localStorage.getItem('bs_format')      || 'with_ref';

    btn.addEventListener('click', function () {
      localStorage.setItem('bs_translation', trlEl.value);
      localStorage.setItem('bs_format',      fmtEl.value);
      msg.textContent = '✓ Gespeichert';
      setTimeout(function () { msg.textContent = ''; }, 2000);
    });
  }());
</script>
</body>
</html>
