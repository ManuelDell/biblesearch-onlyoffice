<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>BibleSearch</title>
  <!-- Sofort sichtbar machen – bevor plugins.css body versteckt -->
  <style>body { display:block !important; visibility:visible !important; }</style>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
</head>
<body>
  <!-- Nochmals per JS, falls plugins.css inline-style setzt -->
  <script>document.body.style.setProperty('display','block','important');document.body.style.setProperty('visibility','visible','important');</script>

  <div class="plugin-inner">

    <div class="block-list">
      <div class="block-list-header">Inline-Einfügung</div>
      <div class="block-list-content">
        <label class="checkbox-button">
          <input type="checkbox" id="enabled">
          <span class="checkbox-button__shape"></span>
          Aktiviert
        </label>
        <p id="toggleSub" style="color:#888;font-size:11px;margin:4px 0 0 22px;">Deaktiviert</p>
      </div>
    </div>

    <div class="block-list">
      <div class="block-list-header">Bibelübersetzung</div>
      <div class="block-list-content">
        <select id="trl" class="combobox">
          <option value="delut">Luther 1912 (Deutsch)</option>
          <option value="elb1905">Elberfelder 1905 (Deutsch)</option>
          <option value="kjv">King James Version (Englisch)</option>
          <option value="web">World English Bible (Englisch)</option>
        </select>
      </div>
    </div>

    <div class="block-list">
      <div class="block-list-header">Versformat</div>
      <div class="block-list-content">
        <select id="linebreaks" class="combobox">
          <option value="prose">Fließtext</option>
          <option value="lines">Jeder Vers eigene Zeile</option>
        </select>
      </div>
    </div>

    <div class="block-list">
      <div class="block-list-header">Ausgabe</div>
      <div class="block-list-content">
        <select id="fmt" class="combobox">
          <option value="with_ref">Text + Bibelstelle</option>
          <option value="text_only">Nur Text</option>
          <option value="with_source">Text + Stelle + Übersetzung</option>
        </select>
      </div>
    </div>

    <div class="block-list">
      <div class="block-list-content">
        <button class="btn normal" id="saveBtn">Speichern</button>
        <span id="savedMsg" style="color:#34a853;font-size:11px;margin-left:8px;"></span>
      </div>
    </div>

    <div class="block-list">
      <div class="block-list-header">Verwendung</div>
      <div class="block-list-content" style="font-size:12px;color:#555;line-height:1.7;">
        <b>@Joh3:16</b> → einzelner Vers<br>
        <b>@1Mo1:1-3</b> → Versbereich<br>
        <b>@Ps23</b> → ganzes Kapitel<br>
        Tippen → Vorschlag erscheint → <b>Tab</b> drücken
      </div>
    </div>

  </div>

  <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <script>document.body.style.setProperty('display','block','important');document.body.style.setProperty('visibility','visible','important');</script>
  <script src="scripts/code.js"></script>
  <script>
  (function () {
    var enabledEl = document.getElementById('enabled');
    var toggleSub = document.getElementById('toggleSub');
    var trlEl     = document.getElementById('trl');
    var lbEl      = document.getElementById('linebreaks');
    var fmtEl     = document.getElementById('fmt');
    var saveBtn   = document.getElementById('saveBtn');
    var savedMsg  = document.getElementById('savedMsg');

    var on = localStorage.getItem('bs_enabled') === '1';
    enabledEl.checked = on;
    toggleSub.textContent = on ? 'Aktiviert' : 'Deaktiviert';

    trlEl.value = localStorage.getItem('bs_translation') || 'delut';
    lbEl.value  = localStorage.getItem('bs_linebreaks')  || 'prose';
    fmtEl.value = localStorage.getItem('bs_format')      || 'with_ref';

    enabledEl.addEventListener('change', function () {
      localStorage.setItem('bs_enabled', this.checked ? '1' : '0');
      toggleSub.textContent = this.checked ? 'Aktiviert' : 'Deaktiviert';
    });

    saveBtn.addEventListener('click', function () {
      localStorage.setItem('bs_translation', trlEl.value);
      localStorage.setItem('bs_linebreaks',  lbEl.value);
      localStorage.setItem('bs_format',      fmtEl.value);
      savedMsg.textContent = '✓ Gespeichert';
      setTimeout(function () { savedMsg.textContent = ''; }, 2000);
    });
  }());
  </script>
</body>
</html>
